<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frontend Mentor | Browser extensions manager UI</title>

    <link rel="icon" type="./assets/image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="./style.css">

</head>

<body class="light">

    <div class="container">
        <header>
            <img src="./assets/images/logo.svg" alt="Extensions-logo" class="logo">
            <div class="icon">
                <img src="./assets/images/icon-sun.svg" alt="sun-icon" class="sun">
                <img src="./assets/images/icon-moon.svg" alt="moon-icon" class="moon">
            </div>
        </header>

        <main>
            <div class="bar">
                <span>Extensions List</span>
                <ul class="filter">
                    <li class="all actived">All</li>
                    <li class="active">Active</li>
                    <li class="inactive">Inactive</li>
                </ul>
            </div>

            <div class="extensions"></div>
        </main>
    </div>

    <script src="main.js"></script>

</body>

</html>
